<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XX Aniversario Signus</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f6fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:380px;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
    text-align:center;
}

h1{
    color:#333;
    margin-bottom:10px;
    font-size:28px;
}

p{
    color:#666;
    margin-bottom:30px;
    line-height:1.5;
}

button{
    width:100%;
    background:#1a73e8;
    color:white;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,.2);
}

.menu{
    display:none;
    margin-top:20px;
}

.menu a{
    display:block;
    text-decoration:none;
    color:#333;
    background:#f3f4f6;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    transition:.2s;
    font-weight:500;
}

.menu a:hover{
    background:#e5e7eb;
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#999;
}

</style>

</head>

<body>

<div class="card">

<h1>✨ XX Aniversario Signus</h1>

<p>Guarda el evento en tu calendario favorito.</p>

<button onclick="mostrarMenu()">
📅 Guardar en mi calendario
</button>

<div class="menu" id="menu">

<a id="google" target="_blank">
🟢 Google Calendar
</a>

<a id="office" target="_blank">
🔵 Office 365 (Outlook)
</a>

<a href="AniversarioSignus.ics">
🍎 Apple Calendar / iPhone / Mac
</a>

<a id="yahoo" target="_blank">
🟣 Yahoo Calendar
</a>

</div>

<div class="footer">
Nos vemos el 15 de octubre ✨
</div>

</div>

<script>

const titulo="XX Aniversario Signus";
const descripcion="XX Aniversario Signus";
const lugar="El Espacio TorreLara";

const inicio="20261015T190000";
const fin="20261015T230000";

document.getElementById("google").href =
⁠ https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${inicio}/${fin}&details=${encodeURIComponent(descripcion)}&location=${encodeURIComponent(lugar)} ⁠;

document.getElementById("office").href =
⁠ https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(titulo)}&startdt=2026-10-15T19:00:00&enddt=2026-10-15T23:00:00&body=${encodeURIComponent(descripcion)}&location=${encodeURIComponent(lugar)} ⁠;

document.getElementById("yahoo").href =
⁠ https://calendar.yahoo.com/?v=60&view=d&type=20&title=${encodeURIComponent(titulo)}&st=20261015T190000&et=20261015T230000&desc=${encodeURIComponent(descripcion)}&in_loc=${encodeURIComponent(lugar)} ⁠;

function mostrarMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

</script>

</body>
</html>
