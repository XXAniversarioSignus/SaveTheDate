<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Añadir al calendario - XX Aniversario Signus</title>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .card{
        background:#fff;
        padding:40px;
        border-radius:12px;
        box-shadow:0 10px 30px rgba(0,0,0,.12);
        text-align:center;
        width:420px;
    }

    h1{
        margin-top:0;
        font-size:28px;
    }

    p{
        color:#666;
        margin-bottom:30px;
    }

    a{
        display:block;
        margin:15px 0;
        padding:15px;
        border-radius:8px;
        color:white;
        text-decoration:none;
        font-weight:bold;
        transition:.2s;
    }

    a:hover{
        transform:translateY(-2px);
    }

    .google{background:#4285F4;}
    .outlook{background:#0078D4;}
    .apple{background:#333;}
</style>

</head>
<body>

<div class="card">

<h1>📅 XX Aniversario Signus</h1>

<p>
15 de octubre de 2026<br>
19:00 – 23:00<br>
Espacio Torrelara
</p>

<a class="google"
href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=XX%20Aniversario%20Signus&dates=20261015T170000Z/20261015T210000Z&location=Espacio%20Torrelara"
target="_blank">
Añadir a Google Calendar
</a>

<a class="outlook"
href="https://outlook.live.com/calendar/0/deeplink/compose?subject=XX%20Aniversario%20Signus&startdt=2026-10-15T19:00:00&enddt=2026-10-15T23:00:00&location=Espacio%20Torrelara"
target="_blank">
Añadir a Outlook
</a>

<a class="apple"
href="AniversarioSignus.ics">
Descargar para Apple Calendar / Outlook (.ics)
</a>

</div>

</body>
</html>
